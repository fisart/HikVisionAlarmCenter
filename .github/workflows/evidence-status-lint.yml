name: Evidence status runtime PHP lint

on:
  pull_request:
    paths:
      - 'ProcessCameraEvents/HikvisionEvidenceStatusRuntime.php'
      - '.github/workflows/evidence-status-lint.yml'
  push:
    branches: [main]
    paths:
      - 'ProcessCameraEvents/HikvisionEvidenceStatusRuntime.php'
      - '.github/workflows/evidence-status-lint.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: php -l ProcessCameraEvents/HikvisionEvidenceStatusRuntime.php
